# Terskelverdier — verified against official sources. Amounts in NOK, excluding VAT.
# Rules are DATA: a change in the law is a new dated entry, never a code change.
#
# EØS-terskelverdiene ble justert med virkning fra 21.04.2026 (regjeringen.no). The EØS thresholds
# are discriminated by oppdragsgiver (statlig | andre) and kontrakttype (vare_tjeneste |
# bygg_anlegg | saerlige_tjenester). The national/innslagspunkt bands below cover goods/services;
# the lower bands for bygg/anlegg and særlige tjenester are a later batch (only their EØS ceilings
# are modelled here, which is what the verified set provides).

# ---------- FOA — innslagspunkt og nasjonale terskler (varer/tjenester) ----------

- id: LOA_INNSLAGSPUNKT_PRE_2026H2
  regime: FOA
  valid_from: 2017-01-01
  valid_to: 2026-06-30
  when:
    all:
      - {field: kontrakttype, op: eq, value: vare_tjeneste}
      - {field: estimated_value, op: lt, value: 100000}
  consequence: UTENFOR_LOVEN
  citation: "Anskaffelsesloven § 2 (innslagspunkt 100 000 kr, t.o.m. 30.06.2026)"
  citation_url: "https://lovdata.no/lov/2016-06-17-73/§2"

- id: LOA_INNSLAGSPUNKT_2026
